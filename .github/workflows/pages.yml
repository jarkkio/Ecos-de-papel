name: Publicar Ecos de Papel

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'live.js'
      - 'config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ecos-de-papel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar archivos estáticos
        run: |
          mkdir -p _site
          cp index.html live.js config.js _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
