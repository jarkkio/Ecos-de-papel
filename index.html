. Del otro lado, todas las ramas apuntaban al mismo lugar: un reloj cuya sombra se movía aunque sus manecillas estaban quietas.\n\nEntonces comprendí que el bosque no guardaba secretos. Guardaba los minutos que habíamos perdido.',date:'2026-10-11'},{id:'s-2',author:'u3',text:'El musgo había cubierto las bisagras y, aun así, la puerta cedió. Al fondo del sendero encontré un reloj clavado en el tronco de un roble. No marcaba una hora. Marcaba una despedida.',date:'2026-10-12'},{id:'s-3',author:'u4',text:'Detrás de la puerta había un bosque idéntico, salvo por una cosa: la niebla recordaba cada palabra que alguna vez negué. Un reloj sin agujas esperaba en una piedra, como si el tiempo hubiese decidido escuchar.',date:'2026-10-12'}],votes:{u1:'s-3',u5:'s-1'}},{id:'d-2',title:'Cartas para alguien que aún no existe',theme:'Drama y ciencia ficción',stage:'upcoming',start:'2026-10-24',end:'2026-11-04',prompt:'A partir de tres pistas visuales, imagina una carta que llega desde otro tiempo. Las tres referencias deben tener sentido dentro de la historia.',starter:'«La carta llevaba mi nombre, pero el matasellos indicaba una fecha que todavía no había ocurrido…»',images:[{label:'Un sobre sin remitente',scene:4},{label:'El cielo de otro siglo',scene:5},{label:'Una ventana iluminada',scene:6}],submissions:[],votes:{}},{id:'d-3',title:'La estación de las despedidas',theme:'Realismo mágico',stage:'closed',start:'2026-09-24',end:'2026-10-06',prompt:'Conecta un tren vacío, una carta olvidada y la luna. Tu final puede ser triste, inesperado o esperanzador.',starter:'«Cuando llegó el último tren, la estación estaba vacía excepto por una maleta que respiraba…»',images:[{label:'Tren de medianoche',scene:8},{label:'Carta olvidada',scene:7},{label:'Luna detrás del andén',scene:3}],submissions:[{id:'s-4',author:'u2',text:'Dentro de la maleta no había ropa, sino cartas. Cada sobre estaba dirigido a alguien que había partido. En el tren, la luna viajaba de pie, sosteniendo un boleto que llevaba mi nombre.',date:'2026-10-01'},{id:'s-5',author:'u3',text:'La abrí con cuidado y salió el sonido de una despedida. El tren aguardaba mientras una carta volaba por el andén; cuando la luna la iluminó, reconocí la letra de mi madre.',date:'2026-10-02'},{id:'s-6',author:'u5',text:'El tren se detuvo sin hacer ruido. La maleta exhaló una carta doblada en cuatro y la luna apareció en cada ventana. No tenía que elegir a dónde ir: debía decidir a quién recordar.',date:'2026-10-03'}],votes:{u1:'s-6',u2:'s-6',u3:'s-4',u4:'s-6'}}]}}

<section style="margin-top:30px"><div class="sectiontop"><div><div class="eyebrow">03 / Las voces</div><h2>Fragmentos compartidos</h2><p>${d.submissions.length} participantes · ${total} votos</p></div></div>${d.stage==='closed'&&winnerList.length?`<div class="winner">${ico('trophy',24)}<div class="eyebrow" style="margin:7px 0 0">Resultado final</div><h3>${winnerList.length===1?'Fragmento ganador':'Empate en primer lugar'}</h3><p class="small" style="margin:0">${winnerList.map(s=>esc(member(s.author).name)).join(' y ')} · ${countVotes(d,winnerList[0].id)} voto(s)</p></div>`:''}${sorted.length?sorted.map(s=>submissionCard(d,s)).join(''):`<div class="empty">${ico('pen',30)}<strong>Una página en blanco</strong><p>Todavía no se han compartido fragmentos. Puedes inaugurar esta historia cuando la dinámica esté abierta.</p></div>`}</section></div>
<aside class="sidepanel"><div class="panel pad"><div class="eyebrow">Tu participación</div><h3>${d.stage==='open'?'Deja tu huella':d.stage==='upcoming'?'La inspiración está cerca':'Un capítulo terminado'}</h3><p class="side-label">${d.stage==='open'?'Escribe tu continuación y compártela con el club.':d.stage==='upcoming'?'Esta dinámica aún no admite participaciones ni votos.':'Esta dinámica está cerrada. Puedes leer sus textos y resultados.'}</p>${d.stage==='open'?`<button class="btn" style="width:100%" data-action="write" data-id="${esc(d.id)}">${ico(mine?'pen':'plus')} ${mine?'Editar mi fragmento':'Publicar mi fragmento'}</button>`:''}${mine?`<div class="notice" style="margin-top:12px">${ico('check',14)} Ya publicaste tu participación.</div>`:''}<div class="divider"></div><div class="info-item"><span>Participaciones</span><strong>${d.submissions.length}</strong></div><div class="info-item"><span>Votos emitidos</span><strong>${total}</strong></div><div class="info-item"><span>Cierre previsto</span><strong>${formatDate(d.end)}</strong></div>${d.stage==='open'?`<p class="help" style="margin-top:15px">Cada miembro dispone de un voto por dinámica. No está permitido votar por el propio fragmento.</p>`:''}</div>${admin()?`<div class="panel pad" style="margin-top:15px"><div class="eyebrow">Administración</div><h3>Gestionar estado</h3><p class="help">Controla manualmente cuándo abrir o finalizar este reto. Los fragmentos anteriores se conservan.</p><div class="field"><label for="stagePicker">Estado</label><select id="stagePicker">${[['upcoming','Próximamente'],['open','En curso'],['closed','Finalizada']].map(([v,l])=>`<option value="${v}" ${d.stage===v?'selected':''}>${l}</option>`).join('')}</select></div><button class="btn outline" style="width:100%" data-action="save-stage" data-id="${esc(d.id)}">Guardar estado</button></div>`:''}</aside></div>`}
function submissionCard(d,s){const a=member(s.author);const picked=d.votes[me().id]===s.id;const mine=s.author===me().id;const allowed=d.stage==='open'&&!mine;return `<article class="panel entry"><div class="entryhead"><a href="#miembros/${encodeURIComponent(a.id)}" class="identity">${avatar(a)}<span><strong>${esc(a.name)} ${mine?'<span class="badge-success">· Tú</span>':''}</strong><small>${formatDate(s.date)}</small></span></a><span class="tag" style="background:#f4f0ec">Fragmento</span></div><p>${esc(s.text)}</p><div class="entryactions"><span class="votes">${ico('heart',14)} ${countVotes(d,s.id)} voto(s)</span><button class="btn ${picked?'secondary':'outline'} smallbtn" data-action="vote" data-did="${esc(d.id)}" data-sid="${esc(s.id)}" ${!allowed?'disabled':''}>${ico('heart',15)} ${picked?'Quitar mi voto':mine?'Tu fragmento':d.stage!=='open'?'Votación cerrada':'Votar'}</button></div></article>`}
function readingPage(){const list=[...db.works].sort((a,b)=>a.views-b.views).filter(w=>!onlyUnread||!(db.readBy[me().id]||[]).includes(w.id));return `<div class="reading-intro"><div><div class="eyebrow" style="color:#d9a995">Club de lectura</div><h1>Búhos de lectura</h1><p>Leemos las obras de nuestra comunidad. La fila se organiza de <strong style="color:#fff">menos vistas a más vistas</strong> para dar prioridad a quienes necesitan lectores.</p></div><div class="owl" aria-hidden="true">❧</div></div><div class="sectiontop"><div><h2>Cola de lectura</h2><p>Ordenada automáticamente según las vistas registradas de cada escrito.</p></div><button class="btn" data-action="new-work">${ico('plus')} Promocionar mi obra</button></div><div class="chiprow" style="margin-bottom:18px"><button class="chip ${!onlyUnread?'active':''}" data-action="reading-filter" data-filter="all">Todas las obras</button><button class="chip ${onlyUnread?'active':''}" data-action="reading-filter" data-filter="unread">Mis pendientes</button></div>${list.length?list.map((w,i)=>{const a=member(w.author),done=(db.readBy[me().id]||[]).includes(w.id),url=safeUrl(w.url);return `<div class="panel readingrow"><div class="rank">${String(i+1).padStart(2,'0')}</div><div class="readingmain"><span class="tag">${esc(w.genre)}</span><h3>${esc(w.title)}</h3><p>${esc(w.description)}</p><div class="readingmeta"><span>${ico('user',13)} <a class="textlink" href="#miembros/${encodeURIComponent(a.id)}">${esc(a.name)}</a></span><span>${ico('eye',13)} ${nfmt(w.views)} vistas</span></div></div><div class="readingactions">${url?`<a class="btn outline smallbtn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Leer obra ${ico('external',14)}</a>`:`<button class="btn outline smallbtn" disabled title="Este miembro aún no ha añadido su enlace">Sin enlace</button>`}<button class="btn ${done?'secondary':'ghost'} smallbtn" data-action="toggle-read" data-id="${esc(w.id)}">${ico('check',14)} ${done?'Leído':'Marcar leído'}</button></div></div>`}).join(''):`<div class="empty"><strong>No hay obras en esta lista</strong><p>Publica la primera obra o cambia el filtro para ver el catálogo completo.</p></div>`}<div class="notice sectiongap"><strong>Regla del club:</strong> las vistas son un dato que el autor declara en esta versión de prueba. Para la versión definitiva se deberá definir cómo actualizar y verificar el conteo de Wattpad u otras plataformas.</div>`}

function spacePage(){const m=me(),mine=db.dynamics.flatMap(d=>d.submissions.filter(s=>s.author===m.id).map(s=>({...s,dynamic:d}))),works=db.works.filter(w=>w.author===m.id);return `<div class="sectiontop"><div><div class="eyebrow">Mi rincón literario</div><h2>Mi espacio</h2><p>Administra tu presentación y encuentra tus participaciones.</p></div><button class="btn" data-action="edit-profile">${ico('pen',15)} Editar perfil</button></div><section class="panel pad spacehero">${avatar(m)}<div><span class="role ${m.role}">${roleName(m.role)}</span><h2>${esc(m.name)}</h2><p>${esc(m.bio)}</p></div></section><div class="split sectiongap"><section class="panel pad"><div class="eyebrow">Mis fragmentos</div><h3>Lectodinamicas en las que participé</h3>${mine.length?mine.map(s=>`<div class="info-item"><a class="textlink" href="#lectodinamicas/${encodeURIComponent(s.dynamic.id)}">${esc(s.dynamic.title)}</a><span>${countVotes(s.dynamic,s.id)} voto(s)</span></div>`).join(''):'<p class="help">Aún no publicas fragmentos. ¡El siguiente puede ser el primero!</p>'}</section><section class="panel pad"><div class="eyebrow">Mis escritos</div><h3>Obras promocionadas</h3>${works.length?works.map(w=>`<div class="info-item"><span>${esc(w.title)}</span><strong>${nfmt(w.views)} vistas</strong></div>`).join(''):'<p class="help">Aún no publicas ninguna obra en Búhos de lectura.</p>'}<button class="btn secondary smallbtn" style="margin-top:17px" data-action="new-work">${ico('plus',14)} Agregar obra</button></section></div><div class="notice sectiongap"><strong>Rol actual: ${roleName(m.role)}.</strong> ${liveMode?'Los permisos se validan en Supabase y no puedes cambiar tu propio rol.':'Este selector de cuentas solo simula permisos para probar la interfaz. En la versión con Supabase, cada persona iniciará sesión de forma segura y no podrá cambiar su propio rol.'}</div>`}
function modal(title,subtitle,content){document.getElementById('modalBody').innerHTML=`<div class="modalhead"><div><div class="eyebrow">Ecos de Papel</div><h2>${title}</h2><p class="small muted" style="margin:0">${subtitle}</p></div><button class="close" type="button" data-action="close-modal" aria-label="Cerrar">×</button></div>${content}`;document.getElementById('modal').showModal()}

function toast(msg){const node=document.getElementById('toast');node.textContent=msg;node.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('visible'),3400)}
function newDynamic(){if(!admin())return toast('Necesitas permisos de administración.');modal('Nueva Lectodinámica','Cada dinámica tendrá su propia página, imágenes, textos y votación.',`<form data-form="dynamic"><div class="formgrid"><div class="field"><label>Título *</label><input name="title" maxlength="100" required placeholder="Ej. El faro de los recuerdos"></div><div class="field"><label>Género o tema *</label><input name="theme" maxlength="65" required placeholder="Misterio y romance"></div><div class="field"><label>Fecha de inicio</label><input type="date" name="start" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Fecha de cierre</label><input type="date" name="end"></div></div><div class="field"><label>Consigna *</label><textarea name="prompt" maxlength="1500" required placeholder="Qué deben escribir y cómo usar las imágenes"></textarea></div><div class="field"><label>Fragmento inicial *</label><textarea name="starter" maxlength="1200" required placeholder="«Todo comenzó cuando…»"></textarea></div><div class="field"><label>Estado inicial</label><select name="stage"><option value="upcoming">Próximamente</option><option value="open">En curso</option></select></div><div class="divider"></div><div class="eyebrow">Las tres referencias visuales</div><p class="help">Si no proporcionas URL de imagen se usará una ilustración de muestra. En la versión final las imágenes se subirán a Supabase Storage.</p>${[1,2,3].map(i=>`<div class="formgrid"><div class="field"><label>Referencia ${i} *</label><input name="label${i}" maxlength="100" placeholder="Descripción breve" required></div><div class="field"><label>URL de imagen ${i} (opcional)</label><input name="url${i}" type="url" placeholder="https://..."></div></div>${liveMode?`<div class="field"><label>O subir imagen ${i} (JPG, PNG, WebP · máx. 5 MB)</label><input name="file${i}" type="file" accept="image/jpeg,image/png,image/webp"></div>`:''}` ).join('')}<div class="modalbottom"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn">${ico('plus',15)} Crear dinámica</button></div></form>`)}
function editSubmission(d){if(d.stage!=='open')return toast('Esta dinámica no recibe fragmentos.');const existing=d.submissions.find(s=>s.author===me().id);modal(existing?'Editar fragmento':'Compartir fragmento','Tu historia aparecerá dentro de esta Lectodinámica.',`<form data-form="submission" data-id="${esc(d.id)}"><div class="field"><label>Tu continuación *</label><textarea required minlength="20" maxlength="5000" name="text" style="min-height:230px" placeholder="Continúa la historia, incorporando las tres referencias visuales…">${esc(existing?.text||'')}</textarea></div><p class="help">De 20 a 5,000 caracteres. Se permite una participación por persona en cada dinámica; podrás editarla mientras esté abierta.</p><div class="modalbottom"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn">${ico('check',15)} ${existing?'Guardar cambios':'Publicar fragmento'}</button></div></form>`)}
function addWork(){modal('Promocionar mi obra','Aparecerá en Búhos de lectura, ordenada por número de vistas.',`<form data-form="work"><div class="field"><label>Título de la obra *</label><input name="title" maxlength="110" required placeholder="El nombre de tu historia"></div><div class="formgrid"><div class="field"><label>Género *</label><input name="genre" maxlength="40" required placeholder="Fantasía, romance…"></div><div class="field"><label>Vistas actuales *</label><input name="views" type="number" min="0" max="1000000000" step="1" required placeholder="0"></div></div><div class="field"><label>Sinopsis breve *</label><textarea name="description" maxlength="480" required placeholder="De qué trata tu obra"></textarea></div><div class="field"><label>Enlace a tu escrito (opcional)</label><input name="url" type="url" placeholder="https://www.wattpad.com/..."></div><p class="help">Si todavía no tienes enlace, podrás compartir la obra como pendiente. La cifra de vistas se registra manualmente en este prototipo.</p><div class="modalbottom"><button class="btn ghost" type="button" data-action="close-modal">Cancelar</button><button class="btn" type="submit">${ico('check',15)} Publicar obra</button></div></form>`)}
function forgotPassword(){
  modal('Recuperar contraseña','Enviaremos un enlace a tu correo registrado.',`<form data-form="forgot"><div class="field"><label>Correo de tu cuenta</label><input name="email" type="email" required autocomplete="email" placeholder="tu@correo.com"></div><p class="help">Si existe una cuenta con ese correo, recibirás instrucciones para recuperar tu acceso.</p><div class="modalbottom"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn">Enviar enlace</button></div></form>`);

function manageRoles(){

}

async function handleClick(ev){const b=ev.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
 if(liveMode){
   if(act==='show-signup'){authMode='signup';renderAuth();return}
   if(act==='show-login'){authMode='login';renderAuth();return}
   if(act==='forgot-password'){forgotPassword();return}
   if(act==='signout'){try{await liveApi.signOut();currentAuth=null;db={currentUser:'',members:[],dynamics:[],works:[],readBy:{}};render();toast('Sesión cerrada.')}catch(e){toast('No se pudo cerrar sesión: '+e.message)}return}
   if(act==='refresh'){await refreshLive();return}
   if(['save-stage','vote','toggle-read'].includes(act)){
     if(!currentAuth)return toast('Inicia sesión para continuar.');
     const who=me().id;
     try{
       if(act==='save-stage'){
         if(!admin())throw Error('Necesitas permisos administrativos.');
         const stage=document.getElementById('stagePicker')?.value;
         if(!['open','upcoming','closed'].includes(stage))return;
         await liveApi.setStage(b.dataset.id,stage);
       }
       if(act==='vote'){
         const d=db.dynamics.find(x=>x.id===b.dataset.did),s=d?.submissions.find(x=>x.id===b.dataset.sid);
         if(!d||d.stage!=='open'||!s||s.author===who)throw Error('Este voto no está permitido.');
         await liveApi.vote(d.id,who,s.id,d.votes[who]);
       }
       if(act==='toggle-read')await liveApi.setRead(b.dataset.id,who,(db.readBy[who]||[]).includes(b.dataset.id));
       await refreshLive(false);toast('Cambios guardados en Supabase.');
     }catch(e){toast('Error: '+e.message)}return;
   }
   if(act==='reset')return;
 }

 if(act==='filter-dynamics'){filters=b.dataset.filter;render()}
 if(act==='reading-filter'){onlyUnread=b.dataset.filter==='unread';render()}
 if(act==='new-dynamic')newDynamic();
 if(act==='manage-roles')manageRoles();
 if(act==='new-work')addWork();
 if(act==='edit-profile')editProfile();
 if(act==='write'){const d=db.dynamics.find(x=>x.id===b.dataset.id);if(d)editSubmission(d)}
 if(act==='close-modal')closeModal();
 if(act==='save-stage'){const d=db.dynamics.find(x=>x.id===b.dataset.id);if(!d||!admin())return;const stage=document.getElementById('stagePicker')?.value;if(!['open','upcoming','closed'].includes(stage))return;d.stage=stage;persist();render();toast('Estado actualizado. El historial se conserva.')}
 if(act==='vote'){const d=db.dynamics.find(x=>x.id===b.dataset.did);if(!d||d.stage!=='open')return;const s=d.submissions.find(x=>x.id===b.dataset.sid);if(!s||s.author===me().id)return toast('No puedes votar por tu propio fragmento.');if(d.votes[me().id]===s.id)delete d.votes[me().id];else d.votes[me().id]=s.id;persist();render();toast('Tu votación se actualizó.')}
 if(act==='toggle-read'){const aid=me().id;db.readBy[aid]??=[];const i=db.readBy[aid].indexOf(b.dataset.id);if(i===-1)db.readBy[aid].push(b.dataset.id);else db.readBy[aid].splice(i,1);persist();render();toast(i===-1?'Marcado como leído.':'De nuevo en pendientes.')}
 if(act==='reset'){if(confirm('¿Restablecer todos los datos locales de prueba? Se perderán tus cambios en este navegador.')){db=initial();persist();filters='all';onlyUnread=false;navigate('#inicio');toast('Datos de prueba restaurados.')}}}
async function handleSubmit(ev){const form=ev.target.closest('form[data-form]');if(!form)return;ev.preventDefault();const fd=new FormData(form),get=k=>String(fd.get(k)||'').trim(),kind=form.dataset.form;
 if(liveMode){
  if(kind==='forgot'){
    const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
    try{await liveApi.resetPassword(get('email'));closeModal();toast('Si el correo está registrado, recibirás instrucciones.');}
    catch(e){toast('Recuperación: '+e.message)}finally{if(submit)submit.disabled=false}
    return;
  }
  if(kind==='new-password'){
    const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
    try{await liveApi.updatePassword(get('password'));closeModal();toast('Contraseña actualizada.');}
    catch(e){toast('Recuperación: '+e.message)}finally{if(submit)submit.disabled=false}
    return;
  }
  if(kind==='login'||kind==='signup'){
    const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
    try{
      const result=kind==='signup'?await liveApi.signUp(get('name'),get('email'),get('password')):await liveApi.signIn(get('email'),get('password'));
      currentAuth=await liveApi.getUser();
      if(!currentAuth){renderAuth();toast('Revisa tu correo para confirmar tu cuenta y luego inicia sesión.');}
      else {await refreshLive();toast('¡Bienvenido a Ecos de Papel!');}
    }catch(e){toast('Acceso: '+e.message)}finally{if(submit)submit.disabled=false}
    return;
  }
  if(!currentAuth)return toast('Inicia sesión para participar.');
  const uid=me().id, submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
  try{
    if(kind==='role'){
      if(me().role!=='admin')throw Error('Esta operación requiere administración.');
      await liveApi.setMemberRole(uid,get('member_id'),get('role'));
      closeModal();await refreshLive(false);toast('Rol actualizado de forma segura.');return;
    }
    if(kind==='dynamic'){
      if(!admin())throw Error('Necesitas permisos administrativos.');
      const start=get('start'),end=get('end');if(start&&end&&end<start)throw Error('La fecha de cierre debe ser posterior al inicio.');
      const refs=[1,2,3].map(i=>({label:get('label'+i),url:get('url'+i),scene:(db.dynamics.length*3+i-1)%9,file:fd.get('file'+i) instanceof File && fd.get('file'+i).size?fd.get('file'+i):null}));
      const dynId=await liveApi.createDynamic({title:get('title'),theme:get('theme'),start,end,prompt:get('prompt'),starter:get('starter'),stage:get('stage'),images:refs},uid);
      closeModal();await refreshLive(false);navigate('#lectodinamicas/'+dynId);toast('Lectodinámica creada.');return;
    }
    if(kind==='submission'){
      const d=db.dynamics.find(x=>x.id===form.dataset.id);if(!d||d.stage!=='open')throw Error('La dinámica no está abierta.');
      const fragment=get('text');if(fragment.length<20)throw Error('Escribe al menos 20 caracteres.');
      await liveApi.saveFragment(d.id,uid,fragment,d.submissions.find(s=>s.author===uid)?.id);closeModal();await refreshLive(false);toast('Fragmento guardado.');return;
    }
    if(kind==='work'){
      const views=Number(get('views'));if(!Number.isSafeInteger(views)||views<0||views>1e9)throw Error('Número de vistas inválido.');
      await liveApi.saveWork(uid,{title:get('title'),genre:get('genre'),views,description:get('description'),url:get('url')});closeModal();await refreshLive(false);navigate('#buhos');toast('Obra publicada.');return;
    }
    if(kind==='profile'){
      await liveApi.saveProfile(uid,{name:get('name'),bio:get('bio'),wattpad:get('wattpad'),other:get('other')});closeModal();await refreshLive(false);toast('Perfil actualizado.');return;
    }
  }catch(e){toast('Error: '+e.message)}finally{if(submit)submit.disabled=false}
  return;
 }

 if(kind==='dynamic'){if(!admin())return;const start=get('start'),end=get('end');if(start&&end&&end<start)return toast('El cierre debe ser posterior al inicio.');const refs=[1,2,3].map((i)=>({label:get('label'+i),url:safeUrl(get('url'+i)),scene:(db.dynamics.length*3+i-1)%9}));db.dynamics.unshift({id:id('dyn'),title:get('title'),theme:get('theme'),stage:get('stage'),start,end,prompt:get('prompt'),starter:get('starter'),images:refs,submissions:[],votes:{}});persist();closeModal();filters='all';navigate('#lectodinamicas/'+db.dynamics[0].id);toast('Lectodinámica creada con su propia página.')}
 if(kind==='submission'){const d=db.dynamics.find(x=>x.id===form.dataset.id);if(!d||d.stage!=='open')return toast('La dinámica no está abierta.');const val=get('text');if(val.length<20)return toast('El fragmento debe tener al menos 20 caracteres.');const existing=d.submissions.find(s=>s.author===me().id);if(existing)existing.text=val;else d.submissions.push({id:id('s'),author:me().id,text:val,date:new Date().toISOString().slice(0,10)});persist();closeModal();render();toast(existing?'Fragmento actualizado.':'Fragmento publicado.')}
 if(kind==='work'){const views=Number(get('views'));if(!Number.isSafeInteger(views)||views<0||views>1e9)return toast('Introduce un número de vistas válido.');db.works.push({id:id('w'),author:me().id,title:get('title'),genre:get('genre'),views,description:get('description'),url:safeUrl(get('url'))});persist();closeModal();navigate('#buhos');toast('Obra añadida a la cola de lectura.')}
 if(kind==='profile'){const m=me();m.name=get('name');m.bio=get('bio');m.wattpad=safeUrl(get('wattpad'));m.other=safeUrl(get('other'));persist();closeModal();render();toast('Perfil actualizado.')}}

function renderAuth(error=''){
 const root=document.getElementById('app');
 root.innerHTML=`<section class="panel authbox"><div class="eyebrow">Comunidad literaria · Acceso</div><h1>${authMode==='login'?'Bienvenido a Ecos de Papel':'Únete a Ecos de Papel'}</h1><p class="muted small">${authMode==='login'?'Accede con tu correo y contraseña para compartir escritos, votar y participar.':'Crea tu cuenta; comenzarás con el rol Miembro. Podría ser necesaria una confirmación por correo.'}</p>${error?`<div class="notice">${esc(error)}</div>`:''}<form data-form="${authMode}">${authMode==='signup'?'<div class="field"><label>Nombre literario</label><input name="name" required minlength="1" maxlength="65" autocomplete="nickname" placeholder="Tu nombre visible"></div>':''}<div class="field"><label>Correo electrónico</label><input name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></div><div class="field"><label>Contraseña</label><input name="password" type="password" minlength="6" required autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="Al menos 6 caracteres"></div><div class="modalbottom"><button class="btn" type="submit">${authMode==='login'?'Entrar al club':'Crear cuenta'}</button></div></form><div class="auth-alt">${authMode==='login'?'¿Todavía no tienes cuenta?':'¿Ya tienes una cuenta?'} <button data-action="${authMode==='login'?'show-signup':'show-login'}">${authMode==='login'?'Regístrate':'Inicia sesión'}</button></div>${authMode==='login'?'<div class="auth-alt"><button type="button" data-action="forgot-password">Olvidé mi contraseña</button></div>':''}</section>`;
}
async function refreshLive(showLoading=true){
 if(!currentAuth){render();return;}
 if(showLoading)document.getElementById('app').innerHTML='<section class="panel pad"><h2>Sincronizando biblioteca…</h2><p class="muted">Cargando datos del club desde Supabase.</p></section>';
 try{db=await liveApi.load(currentAuth.id);if(!db.members.some(m=>m.id===currentAuth.id))throw Error('No se encontró tu perfil. Contacta a la administración.');render();}
 catch(e){document.getElementById('app').innerHTML=`<section class="panel pad"><h2>No se pudo conectar</h2><p class="muted">${esc(e.message)}</p><button type="button" class="btn" data-action="refresh">Reintentar</button></section>`;toast('Error de sincronización: '+e.message)}
}
async function boot(){
 document.getElementById('userSwitcher').hidden=true;
 document.getElementById('modeLabel').textContent='● Supabase · datos reales';
 document.getElementById('sessionTools').hidden=false;
 document.getElementById('resetBtn').hidden=true;
 document.getElementById('footerText').textContent='© Ecos de Papel · Comunidad conectada a Supabase';
 document.getElementById('app').innerHTML='<section class="panel pad"><h2>Iniciando Ecos de Papel…</h2><p class="muted">Conectando de forma segura con el club.</p></section>';
 try{
   if(!window.EcosLive)throw Error('No se cargó el adaptador de Supabase.');
   liveApi=await window.EcosLive.create(cfg.url,cfg.publishableKey);
   currentAuth=await liveApi.getUser();
   liveApi.onAuthChange((event,session)=>{
     if(event==='PASSWORD_RECOVERY'&&session?.user){setTimeout(async()=>{currentAuth=session.user;await refreshLive(false);chooseNewPassword()},0);return}
     if(event==='SIGNED_OUT'){currentAuth=null;db={currentUser:'',members:[],dynamics:[],works:[],readBy:{}};render();return}
     if(event==='SIGNED_IN'&&session?.user?.id&&db.currentUser!==session.user.id){
       // Diferir consultas hasta liberar el bloqueo de Auth de la librería.
       setTimeout(async()=>{currentAuth=session.user;await refreshLive(false)},0);
     }
   });
   if(currentAuth)await refreshLive();else render();
 }catch(e){currentAuth=null;renderAuth('Error al iniciar Supabase: '+e.message);}
}
 document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.getElementById('userSwitcher').addEventListener('change',ev=>{if(liveMode)return;db.currentUser=ev.target.value;persist();render();toast('Vista de prueba: '+me().name)});document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});if(liveMode)boot();else render();
})();
</script>
